name: Build, test and inspect
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studioops
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: studioops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studioops -d studioops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      ConnectionStrings__StudioOps: Host=localhost;Port=5432;Database=studioops_test;Username=studioops;Password=ci-only-password
      STUDIOOPS_TEST_DB: Host=localhost;Port=5432;Database=studioops_test;Username=studioops;Password=ci-only-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore PADO.StudioOps.slnx
      - name: Build
        run: dotnet build PADO.StudioOps.slnx --configuration Release --no-restore
      - name: Unit tests
        run: dotnet test tests/PADO.StudioOps.UnitTests/PADO.StudioOps.UnitTests.csproj --configuration Release --no-build
      - name: Validate repository structure and JavaScript
        run: python scripts/static_check.py
      - name: Integration tests with real PostgreSQL
        run: dotnet test tests/PADO.StudioOps.IntegrationTests/PADO.StudioOps.IntegrationTests.csproj --configuration Release --no-build
      - name: Ensure EF Core migrations match the model
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.13
          dotnet ef migrations has-pending-model-changes --project src/PADO.StudioOps.Api --startup-project src/PADO.StudioOps.Api
      - name: Docker Compose full-stack smoke test
        env:
          POSTGRES_PASSWORD: ci-only-compose-db-password
          STUDIOOPS_ADMIN_PASSWORD: ci-only-compose-admin-password-123!
        run: |
          docker compose up --build -d
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/health/ready | grep -q '"ready"' &&
               curl --fail --silent http://localhost:8080/ | grep -q 'PADO StudioOps'; then
              echo "Docker Compose API and frontend are healthy"
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1
      - name: Tear down disposable Docker Compose stack
        if: always()
        env:
          POSTGRES_PASSWORD: ci-only-compose-db-password
          STUDIOOPS_ADMIN_PASSWORD: ci-only-compose-admin-password-123!
        run: docker compose down -v --remove-orphans
