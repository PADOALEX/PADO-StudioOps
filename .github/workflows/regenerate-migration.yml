name: Regenerate EF migration (one-time)
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Scaffold the authoritative EF Core baseline
        env:
          ConnectionStrings__StudioOps: Host=localhost;Database=unused_design_time;Username=unused;Password=unused
        run: |
          rm -f src/PADO.StudioOps.Api/Data/Migrations/*_InitialStudioOps.cs
          rm -f src/PADO.StudioOps.Api/Data/Migrations/StudioOpsDbContextModelSnapshot.cs
          dotnet restore PADO.StudioOps.slnx
          dotnet tool install --global dotnet-ef --version 10.0.13
          dotnet ef migrations add InitialStudioOps \
            --project src/PADO.StudioOps.Api \
            --startup-project src/PADO.StudioOps.Api \
            --output-dir Data/Migrations
          git add src/PADO.StudioOps.Api/Data/Migrations
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: scaffold authoritative PostgreSQL migration with EF Core'
          git push origin HEAD:main
