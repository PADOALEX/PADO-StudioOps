services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: studioops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: studioops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studioops -d studioops"]
      interval: 5s
      retries: 15
      timeout: 3s
  api:
    build: .
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      ConnectionStrings__StudioOps: Host=db;Port=5432;Database=studioops;Username=studioops;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      STUDIOOPS_AUTO_MIGRATE: "true"
      STUDIOOPS_BOOTSTRAP_ADMIN: "true"
      STUDIOOPS_DEMO_SEED: "true"
      STUDIOOPS_ADMIN_EMAIL: ${STUDIOOPS_ADMIN_EMAIL:-admin@studioops.local}
      STUDIOOPS_ADMIN_PASSWORD: ${STUDIOOPS_ADMIN_PASSWORD:?Set STUDIOOPS_ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
